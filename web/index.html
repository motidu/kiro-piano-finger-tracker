<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Finger Tracker & Visualizer</title>
  <link rel="stylesheet" href="css/viewer.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app-container">
    <div id="canvas-container">
      <canvas id="viewer-canvas"></canvas>
    </div>

    <!-- HUD コントロール -->
    <div id="ui-controls">
      <div class="controls-row">
        <button id="btn-play">▶ 再生</button>
        <button id="btn-calib" class="active">📐 パース補正ピン</button>
      </div>

      <div class="controls-row">
        <input type="file" id="input-load-json" accept=".json" style="display:none">
        <button id="btn-load-json" class="btn-tool" title="Load custom notes JSON">📁 JSON読込</button>
        <input type="file" id="input-load-midi" accept=".mid,.midi" style="display:none">
        <button id="btn-load-midi" class="btn-tool" title="Load Standard MIDI File (.mid)">🎹 MIDI読込</button>
        <input type="file" id="input-load-video" accept="video/*" style="display:none">
        <button id="btn-load-video" class="btn-tool" title="Load background video MP4/WebM">🎬 動画読込</button>
      </div>

      <div class="timeline-container">
        <input type="range" id="time-slider" class="timeline-slider" min="0" max="12.0" step="0.05" value="0">
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8;">
          <span id="time-label">0.0s / 12.0s</span>
          <span id="status-text" class="status-badge">読込中...</span>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot left"></div>左手 (L)</div>
        <div class="legend-item"><div class="legend-dot right"></div>右手 (R)</div>
      </div>

      <!-- Audio Mixer Section -->
      <div class="mixer-section">
        <div class="mixer-header">
          <span>🔊 オーディオミキサー</span>
        </div>
        <div class="mixer-presets">
          <button class="preset-btn active" id="preset-lr">L:動画 / R:MIDI</button>
          <button class="preset-btn" id="preset-mono">中央Mono</button>
          <button class="preset-btn" id="preset-video">動画のみ</button>
          <button class="preset-btn" id="preset-midi">MIDIのみ</button>
        </div>
        <div class="mixer-sliders">
          <div class="slider-row">
            <label>動画Vol</label>
            <input type="range" id="slider-video-vol" min="0" max="1.5" step="0.05" value="1.0">
            <span class="slider-value" id="val-video-vol">1.00</span>
          </div>
          <div class="slider-row">
            <label>MIDIVol</label>
            <input type="range" id="slider-synth-vol" min="0" max="1.5" step="0.05" value="1.0">
            <span class="slider-value" id="val-synth-vol">1.00</span>
          </div>
          <div class="slider-row">
            <label>動画Pan</label>
            <input type="range" id="slider-video-pan" min="-1" max="1" step="0.05" value="-0.8">
            <span class="slider-value" id="val-video-pan">-0.80</span>
          </div>
          <div class="slider-row">
            <label>MIDIPan</label>
            <input type="range" id="slider-synth-pan" min="-1" max="1" step="0.05" value="0.8">
            <span class="slider-value" id="val-synth-pan">0.80</span>
          </div>
        </div>
      </div>

      <div id="loaded-file-badge" class="badge-status">ray_notes.json</div>
    </div>
  </div>

  <div id="drop-overlay">
    <div class="drop-content">
      <span class="drop-icon">📂</span>
      <p>JSON / MIDI (.mid) / 動画 をここへドロップ</p>
    </div>
  </div>
</body>
</html>
